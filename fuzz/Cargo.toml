[package]
name = "pf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lib]
name = "pf_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
profluens-core = { path = "../core" }
pf-mkv = { path = "../plugins/formats/mkv" }
pf-mp4 = { path = "../plugins/formats/mp4" }
pf-tsdemux = { path = "../plugins/formats/tsdemux" }
pf-ps = { path = "../plugins/formats/ps" }
pf-avi = { path = "../plugins/formats/avi" }
pf-flv = { path = "../plugins/formats/flv" }
pf-ogg = { path = "../plugins/formats/ogg" }
pf-text = { path = "../plugins/text" }
pf-subparse = { path = "../plugins/subparse" }
pf-tags = { path = "../plugins/tags" }
pf-hdr = { path = "../plugins/video/hdr" }
pf-libflac = { path = "../plugins/audio/libflac", features = ["encoder"] }
pf-mp3 = { path = "../plugins/audio/mp3" }
profluens-video = { path = "../lib/video" }
profluens-audio = { path = "../lib/audio" }
pf-sim = { path = "../lib/sim" }
pf-vaapi = { path = "../plugins/hw/vaapi" }
pf-bitstream = { path = "../lib/bitstream" }
pf-opus = { path = "../plugins/audio/opus" }
pf-probe = { path = "../lib/probe" }
pf-open = { path = "../lib/open" }
pf-libav = { path = "../plugins/libav" }
pf-harness = { path = "../lib/harness" }

# Own workspace, so the root one neither builds nor excludes it.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mkv_demux"
path = "fuzz_targets/mkv_demux.rs"
test = false
doc = false
bench = false

