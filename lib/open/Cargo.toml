[package]
name = "pf-open"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pf_open"

[features]
default = []
# Builds the demuxer of an opened file and finds a track on it.
pipeline = ["dep:profluens-elements"]

[dependencies]
profluens-core = { path = "../../core" }
# The SPS colour, size and depth a container leaves out.
profluens-video = { path = "../video" }
# The HDR SEI a codec head carries.
pf-hdr = { path = "../../plugins/video/hdr" }
# The speaker bits of an audio head's layout.
profluens-audio = { path = "../audio" }
pf-probe = { path = "../probe" }
pf-mkv = { path = "../../plugins/formats/mkv" }
pf-mp4 = { path = "../../plugins/formats/mp4" }
pf-avi = { path = "../../plugins/formats/avi" }
pf-ogg = { path = "../../plugins/formats/ogg" }
pf-bare = { path = "../../plugins/formats/bare" }
pf-flv = { path = "../../plugins/formats/flv" }
pf-mpegts = { path = "../../plugins/formats/ts" }
# The program choice, the ADTS and sequence header reads and the demuxer of a transport stream.
pf-tsdemux = { path = "../../plugins/formats/tsdemux" }
pf-ps = { path = "../../plugins/formats/ps" }
# The MPEG audio header of a transport or program stream's first frame.
pf-mp3 = { path = "../../plugins/audio/mp3" }
# The filesrc in front of a demuxer.
profluens-elements = { path = "../elements", optional = true }

[dev-dependencies]
# Pipelines the built demuxers run in.
pf-reactor = { path = "../reactor" }
# The decoders a bare file plays through, today's FileSrc path against baresrc.
pf-libflac = { path = "../../plugins/audio/libflac", features = ["encoder"] }
pf-libav = { path = "../../plugins/libav" }

[lints]
workspace = true
