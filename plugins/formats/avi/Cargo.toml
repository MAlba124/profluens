[package]
name = "pf-avi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pf_avi"

[dependencies]
profluens-core = { path = "../../../core" }
pf-registry = { path = "../../../lib/registry" }
# Codec pre-roll for index restarts.
profluens-audio = { path = "../../../lib/audio" }
# The H.264 slice headers and POC a video's presentation order is read from.
profluens-video = { path = "../../../lib/video" }

[dev-dependencies]
pf-reactor = { path = "../../../lib/reactor" }
# Corruption rig for tests/corruption.rs.
pf-sim = { path = "../../../lib/sim", features = ["harness"] }
# End-to-end pipeline test.
profluens-elements = { path = "../../../lib/elements" }
