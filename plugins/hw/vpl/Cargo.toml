[package]
name = "pf-vpl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Links the system libvpl dispatcher, declared so cargo flags a double link.
links = "vpl"

[lib]
name = "pf_vpl"

[dependencies]
profluens-core = { path = "../../../core" }
pf-registry = { path = "../../../lib/registry" }
profluens-video = { path = "../../../lib/video" }
pf-hdr = { path = "../../video/hdr" }

[dev-dependencies]
pf-harness = { path = "../../../lib/harness" }
# Software decoders the hardware is held against.
pf-libav = { path = "../../libav" }
pf-av1 = { path = "../../video/av1" }
pf-vaapi = { path = "../vaapi" }
pf-mkv = { path = "../../formats/mkv" }
